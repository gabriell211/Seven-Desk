name: Seven Desk VPS Docker Integration

# New PR commits supersede stale CI runs. Never cancel push/release runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  pull_request:
    paths:
      - "deploy/vps/**"
      - "website/**"
      - "scripts/homologation_preflight.py"
      - "scripts/test_homologation_preflight.py"
      - "docs/homologacao-evidencias.template.json"
      - ".github/workflows/vps-docker.yml"
  push:
    branches: [main]
    paths:
      - "deploy/vps/**"
      - "website/**"
      - "scripts/homologation_preflight.py"
      - "scripts/test_homologation_preflight.py"
      - "docs/homologacao-evidencias.template.json"
      - ".github/workflows/vps-docker.yml"

permissions:
  contents: read

jobs:
  isolated-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Homologation preflight unit tests (offline)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_homologation_preflight.py -v
          python3 -m json.tool docs/homologacao-evidencias.template.json > /dev/null

      - name: Prepare synthetic CI secrets (not actual credentials)
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0700 /etc/sevendesk/secrets
          for secret in pg_password app_db_password auth_secret; do
            openssl rand -hex 32 | sudo tee "/etc/sevendesk/secrets/$secret" >/dev/null
          done
          printf 'CI-fake-SMTP-password-not-used\n' | sudo tee /etc/sevendesk/secrets/smtp_password >/dev/null
          printf 'CI-fake-payment-key-disabled\n' | sudo tee /etc/sevendesk/secrets/infinitepay_api_key >/dev/null
          sudo find /etc/sevendesk/secrets -type f -exec chmod 0600 {} +
          # Docker Compose file-backed secrets retain host permissions on Linux.
          # Grant read-only access solely to the non-root Node runtime UID (1000).
          sudo apt-get update -qq
          sudo apt-get install -y -qq acl
          sudo find /etc/sevendesk/secrets -type f -exec setfacl -m u:1000:r-- {} +
          docker compose version

      - name: Validate Compose and build the site image
        run: |
          set -euo pipefail
          docker compose -f deploy/vps/compose.yml config -q
          docker compose -f deploy/vps/compose.yml build site

      - name: Run PostgreSQL and Better Auth schema migration
        run: |
          set -euo pipefail
          docker compose -f deploy/vps/compose.yml up -d db
          docker compose -f deploy/vps/compose.yml --profile setup run --rm migrate

      - name: Start isolated site and test disabled endpoints
        run: |
          set -euo pipefail
          docker compose -f deploy/vps/compose.yml up -d site
          docker compose -f deploy/vps/compose.yml exec -T site node -e \
            "fetch('http://127.0.0.1:3100/api/account-availability').then(async r => { const x=await r.json(); if(r.status!==200||x.loginEnabled!==false||x.registrationEnabled!==false)process.exit(1) }).catch(e=>{console.error(e.message);process.exit(1)})"
          docker compose -f deploy/vps/compose.yml exec -T site node -e \
            "const {pool}=require('./lib/db-pool'); pool().query('SELECT count(*)::int AS total FROM seven_users').then(r=>{if(r.rows[0].total!==0)process.exitCode=1}).catch(e=>{console.error(e.message);process.exitCode=1}).finally(()=>pool().end())"
          docker compose -f deploy/vps/compose.yml exec -T db sh -c \
            'PGPASSWORD="$(cat /run/secrets/pg_password)" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT count(*) FROM seven_desk_payment_orders"'
          docker compose -f deploy/vps/compose.yml exec -T site node -e \
            "fetch('http://127.0.0.1:3100/api/billing-status').then(r=>r.json()).then(x=>{if(x.checkoutAvailable!==false)process.exit(1)})"

      - name: Verify Traefik downloads Compose, Caddy and private-file denial
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/vps/compose.yml -f deploy/vps/traefik-downloads.compose.yml config -q
          docker run --rm --network none \
            -v "$PWD/deploy/vps/Caddyfile.downloads:/etc/caddy/Caddyfile:ro" \
            --entrypoint caddy caddy:2.11.9-alpine validate --config /etc/caddy/Caddyfile
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 /srv/sevendesk/downloads
          public_file="$(mktemp /srv/sevendesk/downloads/sevendesk-ci-public-XXXXXX.txt)"
          hidden_file="$(mktemp /srv/sevendesk/downloads/.sevendesk-ci-hidden-XXXXXX)"
          trap 'rm -f "$public_file" "$hidden_file"' EXIT
          printf 'seven-desk-static-file-ok\n' > "$public_file"
          printf 'private\n' > "$hidden_file"
          chmod 0644 "$public_file" "$hidden_file"
          docker compose -f deploy/vps/compose.yml -f deploy/vps/traefik-downloads.compose.yml up -d --no-deps downloads
          container="$(docker compose -f deploy/vps/compose.yml -f deploy/vps/traefik-downloads.compose.yml ps -q downloads)"
          test -n "$container"
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$container")"
          test -n "$ip"
          test "$(curl -fsS --retry 5 --retry-connrefused --retry-delay 1 \
            "http://$ip:8080/$(basename "$public_file")")" = "seven-desk-static-file-ok"
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            "http://$ip:8080/$(basename "$hidden_file")")" = "404"

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose -f deploy/vps/compose.yml ps || true
          docker compose -f deploy/vps/compose.yml logs --tail=70 db site || true

      - name: Stop temporary test stack
        if: always()
        run: docker compose -f deploy/vps/compose.yml -f deploy/vps/traefik-downloads.compose.yml down --remove-orphans || true

