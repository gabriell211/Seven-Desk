  build-for-macOS:
    name: ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    needs: [generate-bridge]
    # Pin codec dependencies to the same minimum as Flutter and Rust.
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.job.arch == 'aarch64' && '12.3' || '11.0' }}
    # Use the same pinned Git sources as the other platforms.
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-apple-darwin,
              os: macos-15-intel, #macos-latest or macos-14 use M1 now, https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#:~:text=14%20GB-,macos%2Dlatest%20or%20macos%2D14,-The%20macos%2Dlatestlabel
              extra-build-args: "",
              extra-cargo-features: "",
              arch: x86_64,
              vcpkg-triplet: x64-osx,
            }
          - {
              target: aarch64-apple-darwin,
              os: macos-15,
              # extra-build-args: "--disable-flutter-texture-render", # disable this for mac, because we see a lot of users reporting flickering both on arm and x64, and we can not confirm if texture rendering has better performance if htere is no vram, https://github.com/rustdesk/rustdesk/issues/6296
              extra-build-args: "--screencapturekit",
              extra-cargo-features: ",screencapturekit",
              arch: aarch64,
              vcpkg-triplet: arm64-osx,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Link Apple compiler runtime (macOS Intel)
        if: matrix.job.arch == 'x86_64'
        shell: bash
        run: |
          runtime="$(xcrun clang -print-resource-dir)/lib/darwin/libclang_rt.osx.a"
          test -f "$runtime"
          echo "CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS=-C link-arg=$runtime" >> "$GITHUB_ENV"

      - name: Verify pinned upstream Git dependencies (macOS)
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="$(mktemp -d)"
          trap 'rm -rf -- "$probe_dir"' EXIT
          for record in \
            "hwcodec ec38ebaf2454269d4c5668a57e3813c6e5541be7" \
            "externals 8903740a1f47884906a6e347ad3d8d56304d9771"; do
            name="${record%% *}"
            sha="${record#* }"
            git init -q "$probe_dir/$name"
            GIT_TERMINAL_PROMPT=0 git -C "$probe_dir/$name" \
              -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=15 \
              fetch --quiet "https://github.com/rustdesk-org/$name.git" \
              "+$sha:refs/commit/$sha"
            test "$(git -C "$probe_dir/$name" rev-parse "refs/commit/$sha")" = "$sha"
            git -C "$probe_dir/$name" cat-file -e "$sha^{commit}"
            echo "Verified pinned upstream Git commit: $name $sha"
          done

      - name: Import the codesign cert
        if: env.MACOS_P12_BASE64 != null
        uses: apple-actions/import-codesign-certs@253ddeeac23f2bdad1646faac5c8c2832e800071 # v1
        with:
          p12-file-base64: ${{ secrets.MACOS_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
          keychain: rustdesk

      - name: Check sign and import sign key
        if: env.MACOS_P12_BASE64 != null
        run: |
          security default-keychain -s rustdesk.keychain
          security find-identity -v

      - name: Import notarize key
        if: env.MACOS_P12_BASE64 != null
        uses: timheuer/base64-to-file@adaa40c0c581f276132199d4cf60afa07ce60eac # v1.2
        with:
          # https://gregoryszorc.com/docs/apple-codesign/stable/apple_codesign_rcodesign.html#notarizing-and-stapling
          fileName: rustdesk.json
          fileDir: ${{ github.workspace }}
          encodedString: ${{ secrets.MACOS_NOTARIZE_JSON }}

      - name: Install rcodesign tool
        if: env.MACOS_P12_BASE64 != null
        shell: bash
        run: |
          pushd /tmp
          wget https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.22.0/apple-codesign-0.22.0-macos-universal.tar.gz
          tar -zxvf apple-codesign-0.22.0-macos-universal.tar.gz
          mv apple-codesign-0.22.0-macos-universal/rcodesign /usr/local/bin
          popd

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          # pkg-config is handled in a separate step, because it may be already installed by `macos-latest`(14.7.1) runner
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        shell: bash
        run: |
          set -euo pipefail
          # FFmpeg/AOM require NASM 2.x; do not use Homebrew's newer NASM 3.x.
          version=2.16.03
          expected_sha256=0d29bcd8a5fc617333f4549c7c1f93d1866a4a0915c40359e0a8585bb1a5aa75
          archive="nasm-${version}-macosx.zip"
          scratch="$(mktemp -d)"
          trap 'rm -rf -- "$scratch"' EXIT
          # The upstream DNS can fail on GitHub macOS runners. Both mirrors
          # serve byte-identical archives verified against the upstream hash.
          sources=(
            "https://www.nasm.us/pub/nasm/releasebuilds/${version}/macosx/${archive}"
            "https://linux.cs.nctu.edu.tw/kde/files/craft/3rdparty/nasm/${version}/${archive}"
            "https://files.kde.org/craft/3rdparty/nasm/${version}/${archive}"
          )
          downloaded=false
          for url in "${sources[@]}"; do
            if curl --fail --location --silent --show-error --retry 2 --retry-delay 1 \
                --connect-timeout 8 --max-time 45 --output "$scratch/$archive" "$url"; then
              actual_sha256="$(shasum -a 256 "$scratch/$archive" | awk '{print $1}')"
              if [[ "$actual_sha256" == "$expected_sha256" ]]; then
                downloaded=true
                break
              fi
              echo "::warning::NASM archive checksum mismatch from $url"
            fi
          done
          if [[ "$downloaded" != true ]]; then
            echo "::error::Unable to obtain a verified NASM ${version} archive" >&2
            exit 1
          fi
          unzip -q "$scratch/$archive" -d "$scratch"
          test -f "$scratch/nasm-${version}/nasm"
          sudo install -m 0755 "$scratch/nasm-${version}/nasm" /usr/local/bin/nasm
          installed_version="$(/usr/local/bin/nasm --version)"
          echo "$installed_version"
          [[ "$installed_version" == *"NASM version ${version}"* ]] || {
            echo "::error::Incorrect installed NASM version: $installed_version" >&2
            exit 1
          }

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_MACOS_ARM_VERSION || env.FLUTTER_VERSION }}

      - name: Keep CocoaPods for Flutter 3.44 (arm64)
        # 3.44 turns on Swift Package Manager by default, which would migrate Runner.xcodeproj and
        # move some plugins off CocoaPods; every plugin still ships a podspec.
        if: ${{ matrix.job.arch == 'aarch64' }}
        run: flutter config --no-enable-swift-package-manager

      - name: Patch flutter
        # Flutter 3.44 (arm64) already has this dropdown fix.
        if: ${{ matrix.job.arch == 'x86_64' }}
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Patch Seven Desk sources for Flutter 3.44 (arm64)
        # The script uses GNU `sed -i`, which macOS's BSD sed rejects.
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: |
          brew install gnu-sed
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # arm64's *.freezed.dart must match the freezed it resolves under Flutter 3.44.
          name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
          path: ./

      - name: Run the Dart tests
        # x86_64 tests the Flutter 3.24.5 sources most platforms ship, arm64 the patched 3.44 ones.
        if: ${{ !inputs.upload-artifact }}
        working-directory: flutter
        run: flutter test --timeout 60s

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true

      - name: Show version information (Rust, cargo, Clang)
        shell: bash
        run: |
          clang --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V

      - name: Build Seven Desk
        run: |
          # Keep Rust and Flutter aligned with the vcpkg deployment targets.
          if [ "${{ matrix.job.target }}" = "x86_64-apple-darwin" ]; then
            MIN_MACOS_VERSION="11.0"
          elif [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
          fi
          if [ -n "${MIN_MACOS_VERSION:-}" ]; then
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
            export MACOSX_DEPLOYMENT_TARGET="${MIN_MACOS_VERSION}"
            echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          fi
          python3 ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Verify macOS app identity
        run: |
          app="flutter/build/macos/Build/Products/Release/SevenDesk.app"
          test -x "$app/Contents/MacOS/SevenDesk"
          test -f "$app/Contents/MacOS/service"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = 'tech.sevendesk.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Contents/Info.plist")" = 'Seven Desk'

      - name: Test verified updates
        if: env.PUBLISH_UPDATE_METADATA == 'true'
        run: |
          python3 -m unittest res/update/test_macos_update_scripts.py
          cargo test --locked --release --lib platform::macos::update_tests --features "flutter,hwcodec,unix-file-copy-paste${{ matrix.job.extra-cargo-features }}"
          cargo test --locked --release --lib verified_dmg_tests --features "flutter,hwcodec,unix-file-copy-paste${{ matrix.job.extra-cargo-features }}"
          cargo test --locked --release --lib update_metadata::tests --features "flutter,hwcodec,unix-file-copy-paste${{ matrix.job.extra-cargo-features }}"

      - name: Run the Rust tests
        if: ${{ !inputs.upload-artifact && matrix.job.arch == 'aarch64' }}
        run: |
          # The build's own features, so the tests see the code that ships. MACOSX_DEPLOYMENT_TARGET
          # comes from the build step's export.
          FEATURES=$(python3 ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }} --print-features)
          cargo test --locked --release --lib --features "$FEATURES"
          # Opt-in, and its macOS tests run nowhere else.
          cargo test --locked --release -p clipboard --features unix-file-copy-paste

      - name: create unsigned dmg
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --icon "SevenDesk.app" 200 190 --hide-extension "SevenDesk.app" --window-size 800 400 --app-drop-link 600 185 sevendesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg ./flutter/build/macos/Build/Products/Release/SevenDesk.app

      - name: Upload unsigned macOS app
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sevendesk-unsigned-macos-${{ matrix.job.arch }}
          path: sevendesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg # can not upload the directory directly or tar.gz, which destroy the link structure, causing the codesign failed

      - name: Codesign app and create signed dmg
        if: ${{ !inputs.qa-artifacts && env.MACOS_P12_BASE64 != null && env.UPLOAD_ARTIFACT == 'true' }}
        run: |
          # Patch create-dmg to give more attempts to unmount image
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          # Unlock keychain
          security default-keychain -s rustdesk.keychain
          security unlock-keychain -p ${{ secrets.MACOS_P12_PASSWORD }} rustdesk.keychain
          # start sign the rustdesk.app and dmg
          rm -rf *.dmg || true
          # the identity secret carries its own shell quoting, so expand it inline like the dmg codesign below
          bash ./.github/scripts/sign-macos-app.sh \
            ./flutter/build/macos/Build/Products/Release/SevenDesk.app \
            ${{ secrets.MACOS_CODESIGN_IDENTITY }} \
            ./flutter/macos/Runner/Release.entitlements
          if [ "$PUBLISH_UPDATE_METADATA" = "true" ]; then
            reported_version="$(./flutter/build/macos/Build/Products/Release/SevenDesk.app/Contents/MacOS/SevenDesk --version)"
            if [ "$reported_version" != "$VERSION" ]; then
              echo "::error::RustDesk reports version '$reported_version', expected '$VERSION'"
              exit 1
            fi
          fi
          create-dmg --icon "SevenDesk.app" 200 190 --hide-extension "SevenDesk.app" --window-size 800 400 --app-drop-link 600 185 sevendesk-${{ env.VERSION }}.dmg ./flutter/build/macos/Build/Products/Release/SevenDesk.app
          codesign --force --options runtime -s ${{ secrets.MACOS_CODESIGN_IDENTITY }} --deep --strict sevendesk-${{ env.VERSION }}.dmg -vvv
          # notarize the sevendesk-${{ env.VERSION }}.dmg
          rcodesign notary-submit --api-key-path ${{ github.workspace }}/rustdesk.json  --staple sevendesk-${{ env.VERSION }}.dmg

      - name: Rename Seven Desk
        if: env.UPLOAD_ARTIFACT == 'true'
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
          ARCH: ${{ matrix.job.arch }}
        run: |
          if [ -f "sevendesk-${VERSION}.dmg" ]; then
              mv "sevendesk-${VERSION}.dmg" "sevendesk-${VERSION}-${ARCH}.dmg"
          fi
          test -f "sevendesk-${VERSION}-${ARCH}.dmg"

      - name: Upload signed macOS DMG
        if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA == 'true' && env.MACOS_P12_BASE64 != null
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.job.arch }}-dmg
          path: ./sevendesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg
          if-no-files-found: error

      - name: Publish DMG package
        if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA != 'true' && inputs.upload-artifact && !inputs.qa-artifacts
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          name: sevendesk
          files: |
            sevendesk*-${{ matrix.job.arch }}.dmg

  verify-qa-binaries:
    if: ${{ inputs.qa-artifacts }}
    needs: [build-for-windows-flutter, build-for-macOS, build-rustdesk-android-universal, build-appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout verification script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download QA packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sevendesk-qa-*
          path: qa-packages
          merge-multiple: true
      - name: Download unsigned macOS QA applications
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sevendesk-unsigned-macos-*
          path: qa-packages
          merge-multiple: true
      - name: Validate binary signatures, version and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_verify_qa_artifacts.py -v
          python3 scripts/verify_qa_artifacts.py \
            --root qa-packages \
            --version "${{ env.VERSION }}" \
            --commit "${{ github.sha }}" \
            --output qa-build-manifest.json
      - name: Upload private QA evidence (not a GitHub release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sevendesk-qa-build-sha256
          path: qa-build-manifest.json
          if-no-files-found: error

  publish-signed-update-metadata:
    needs: [build-for-windows-flutter, build-for-windows-sciter, build-for-macOS]
    runs-on: ubuntu-22.04
    if: ${{ inputs.upload-artifact && inputs.publish-update-metadata && github.repository == 'rustdesk/rustdesk' }}
    concurrency:
      group: signed-update-${{ inputs.upload-tag }}
      cancel-in-progress: false
    steps:
      - name: Refuse to replace published update metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ env.TAG_NAME }}
        run: |
          set -euo pipefail
          releases="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          release_id="$(
            jq -r --arg tag "$TAG_NAME" '
              [.[][] | select(.tag_name == $tag)] |
              if length == 0 then ""
              elif length == 1 then .[0].id
              else error("multiple releases found for tag")
              end
            ' <<<"$releases"
          )"
          if [ -z "$release_id" ]; then
            exit 0
          fi
          assets="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100")"
          if jq -e 'any(.[][]; .name == "rustdesk-update.json")' <<<"$assets" >/dev/null; then
            echo "::error::Signed update metadata is already published for ${TAG_NAME}; use a new release tag for corrected artifacts."
            exit 1
          fi

      - name: Checkout source code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: 'python -m pip install --only-binary=:all: --require-hashes -r res/update/update_metadata_requirements.txt'

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: windows-*
          path: ./artifacts/
          merge-multiple: true

      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-*
          path: ./artifacts/
          merge-multiple: true

      - name: Sign update metadata
        env:
          RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.RUSTDESK_UPDATE_ED25519_SEED }}
        run: |
          python res/update/generate_update_metadata.py sign \
            --artifact windows x86_64 exe "./artifacts/rustdesk-${VERSION}-x86_64.exe" \
            --artifact windows x86_64 msi "./artifacts/rustdesk-${VERSION}-x86_64.msi" \
            --artifact windows aarch64 exe "./artifacts/rustdesk-${VERSION}-aarch64.exe" \
            --artifact windows aarch64 msi "./artifacts/rustdesk-${VERSION}-aarch64.msi" \
            --artifact windows x86 exe "./artifacts/rustdesk-${VERSION}-x86-sciter.exe" \
            --artifact macos aarch64 dmg "./artifacts/rustdesk-${VERSION}-aarch64.dmg" \
            --artifact macos x86_64 dmg "./artifacts/rustdesk-${VERSION}-x86_64.dmg" \
            --version "$VERSION" --release-id "$TAG_NAME" \
            --package-id rustdesk \
            --release-base-url https://github.com/rustdesk/rustdesk/releases/download \
            --published-at "$(git log -1 --format=%cI)" \
            --metadata-out ./rustdesk-update.json \
            --signature-out ./rustdesk-update.json.sig

      - name: Verify update metadata
        env:
          RUSTDESK_UPDATE_ED25519_PUBLIC_KEY: ${{ vars.RUSTDESK_UPDATE_ED25519_PUBLIC_KEY }}
        run: |
          python res/update/generate_update_metadata.py verify \
            --metadata ./rustdesk-update.json \
            --signature ./rustdesk-update.json.sig \
            --artifact "./artifacts/rustdesk-${VERSION}-x86_64.exe" \
            --artifact "./artifacts/rustdesk-${VERSION}-x86_64.msi" \
            --artifact "./artifacts/rustdesk-${VERSION}-aarch64.exe" \
            --artifact "./artifacts/rustdesk-${VERSION}-aarch64.msi" \
            --artifact "./artifacts/rustdesk-${VERSION}-x86-sciter.exe" \
            --artifact "./artifacts/rustdesk-${VERSION}-aarch64.dmg" \
            --artifact "./artifacts/rustdesk-${VERSION}-x86_64.dmg" \
            --version "$VERSION" --release-id "$TAG_NAME" \
            --package-id rustdesk \
            --release-base-url https://github.com/rustdesk/rustdesk/releases/download

      - name: Upload signed update artifacts
        if: ${{ inputs.upload-artifact && !inputs.qa-artifacts }}
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          fail_on_unmatched_files: true
          tag_name: ${{ env.TAG_NAME }}
          name: sevendesk
          files: |
            ./artifacts/rustdesk-${{ env.VERSION }}-x86_64.exe
            ./artifacts/rustdesk-${{ env.VERSION }}-x86_64.msi
            ./artifacts/rustdesk-${{ env.VERSION }}-aarch64.exe
            ./artifacts/rustdesk-${{ env.VERSION }}-aarch64.msi
            ./artifacts/rustdesk-${{ env.VERSION }}-x86-sciter.exe
            ./artifacts/rustdesk-${{ env.VERSION }}-aarch64.dmg
            ./artifacts/rustdesk-${{ env.VERSION }}-x86_64.dmg

      # The release action replaces same-name assets, so keep published sidecars
      # until replacements are ready.
      - name: Upload signed update metadata signature
        if: ${{ inputs.upload-artifact && !inputs.qa-artifacts }}
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          fail_on_unmatched_files: true
          tag_name: ${{ env.TAG_NAME }}
          name: sevendesk
          files: ./rustdesk-update.json.sig

      # Clients discover the release through metadata, so publish it only after every referenced asset.
      - name: Publish signed update metadata
        if: ${{ inputs.upload-artifact && !inputs.qa-artifacts }}
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          fail_on_unmatched_files: true
          tag_name: ${{ env.TAG_NAME }}
          name: sevendesk
          files: ./rustdesk-update.json

  publish_unsigned:
    needs:
      - build-for-macOS
      - build-for-windows-flutter
      - build-for-windows-sciter
    runs-on: ubuntu-latest
    if: ${{ inputs.upload-artifact }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sevendesk-unsigned-macos-x86_64
          path: ./

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sevendesk-unsigned-macos-aarch64
          path: ./

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sevendesk-unsigned-windows-x86_64
          path: ./windows-x86_64/

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sevendesk-unsigned-windows-aarch64
          path: ./windows-aarch64/

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sevendesk-unsigned-windows-x86
          path: ./windows-x86/

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sevendesk-unsigned-msi-template-x86_64
          path: ./msi-template/

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sevendesk-unsigned-msi-template-aarch64
          path: ./msi-template/

      - name: Download Artifacts
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sevendesk-unsigned-packer-template-x86_64
          path: ./packer-template/

      - name: Download Artifacts
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sevendesk-unsigned-packer-template-aarch64
          path: ./packer-template/

      - name: Download Artifacts
        if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sevendesk-unsigned-packer-template-x86
          path: ./packer-template/

      - name: Combine unsigned app
        run: |
          packer_template=()
          if [[ "$SIGN_BASE_URL" != '-2' ]]; then
            packer_template=(packer-template)
          fi
          tar czf sevendesk-${{ env.VERSION }}-unsigned.tar.gz *.dmg windows-x86_64 windows-aarch64 windows-x86 msi-template "${packer_template[@]}"

      - name: Publish unsigned app
        if: ${{ inputs.upload-artifact && !inputs.qa-artifacts }}
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          name: sevendesk
          files: sevendesk-${{ env.VERSION }}-unsigned.tar.gz

  build-rustdesk-android:
    needs: [generate-bridge]
    name: build Seven Desk android apk ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              arch: aarch64,
              target: aarch64-linux-android,
              os: ubuntu-24.04,
              reltype: release,
              suffix: "",
            }
          - {
              arch: armv7,
              target: armv7-linux-androideabi,
              os: ubuntu-24.04,
              reltype: release,
              suffix: "",
            }
          - {
              arch: x86_64,
              target: x86_64-linux-android,
              os: ubuntu-24.04,
              reltype: release,
              suffix: "",
            }
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          # GitHub-hosted Ubuntu package mirrors occasionally return 503 or timeout.
          # Keep APT signature verification enabled; use official HTTPS sources.
          for apt_sources in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
            if [ -f "$apt_sources" ]; then
              sudo sed -i \
                -e 's#mirror+file:/etc/apt/apt-mirrors.txt#https://archive.ubuntu.com/ubuntu/#g' \
                -e 's#http://azure.archive.ubuntu.com/ubuntu/#https://archive.ubuntu.com/ubuntu/#g' \
                -e 's#http://archive.ubuntu.com/ubuntu/#https://archive.ubuntu.com/ubuntu/#g' \
                -e 's#http://security.ubuntu.com/ubuntu/#https://security.ubuntu.com/ubuntu/#g' \
                "$apt_sources"
            fi
          done
          apt_retry() {
            local attempt
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=45 -o Acquire::https::Timeout=45 "$@"; then
                return 0
              fi
              if [ "$attempt" -ge 3 ]; then
                echo "APT dependencies remain unavailable after three attempts" >&2
                return 1
              fi
              sleep $((attempt * 20))
            done
          }
          apt_retry update
          apt_retry install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libc6-dev \
               libclang-dev \
               libunwind-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-dev \
               nasm \
               ninja-build \
               openjdk-17-jdk-headless \
               pkg-config \
               tree \
               wget

      - name: Checkout source code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}
          cache: true

      - name: Cache Android Gradle dependencies
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          case ${{ matrix.job.target }} in
            aarch64-linux-android)
              ANDROID_TARGET=arm64-v8a
            ;;
            armv7-linux-androideabi)
              ANDROID_TARGET=armeabi-v7a
            ;;
            x86_64-linux-android)
              ANDROID_TARGET=x86_64
            ;;
            i686-linux-android)
              ANDROID_TARGET=x86
            ;;
          esac
          if ! bash ./flutter/build_android_deps.sh "${ANDROID_TARGET}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-android # TODO: drop '-android' part after caches are invalidated
          key: ${{ matrix.job.target }}

      - name: Build Seven Desk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          case ${{ matrix.job.target }} in
            aarch64-linux-android)
              bash ./flutter/ndk_arm64.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
            ;;
            armv7-linux-androideabi)
              bash ./flutter/ndk_arm.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
            ;;
            x86_64-linux-android)
              bash ./flutter/ndk_x64.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so
            ;;
            i686-linux-android)
              bash ./flutter/ndk_x86.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/x86
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so
            ;;
          esac

      - name: Upload Seven Desk library to Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libsevendesk.so.${{ matrix.job.target }}
          path: ./target/${{ matrix.job.target }}/release/liblibrustdesk.so

      - name: Build Seven Desk
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          # Seed checksummed dependencies for Flutter's independent Gradle included build.
          bash .github/scripts/prepare-android-gradle-maven.sh
          # Increase Gradle JVM memory for CI builds
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # temporary use debug sign config
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          case ${{ matrix.job.target }} in
            aarch64-linux-android)
              mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
              # build flutter
              pushd flutter
              flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-arm64 --split-per-abi
              mv build/app/outputs/flutter-apk/app-arm64-v8a-${{ matrix.job.reltype }}.apk ../sevendesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
            ;;
            armv7-linux-androideabi)
              mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
              # build flutter
              pushd flutter
              flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-arm --split-per-abi
              mv build/app/outputs/flutter-apk/app-armeabi-v7a-${{ matrix.job.reltype }}.apk ../sevendesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
            ;;
            x86_64-linux-android)
              mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86_64/
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so
              # build flutter
              pushd flutter
              flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-x64 --split-per-abi
              mv build/app/outputs/flutter-apk/app-x86_64-${{ matrix.job.reltype }}.apk ../sevendesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
            ;;
            i686-linux-android)
              mkdir -p ./flutter/android/app/src/main/jniLibs/x86
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/i686-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86/
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so
              # build flutter
              pushd flutter
              flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-x86 --split-per-abi
              mv build/app/outputs/flutter-apk/app-x86-${{ matrix.job.reltype }}.apk ../sevendesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
            ;;
          esac
          popd
          mkdir -p signed-apk; pushd signed-apk
          mv ../sevendesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk .

      # https://github.com/r0adkll/sign-android-release/issues/84#issuecomment-1889636075
      - name: Upload QA Android APK (debug-signed, not for distribution)
        if: inputs.qa-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sevendesk-qa-android-${{ matrix.job.arch }}
          path: signed-apk/sevendesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
          if-no-files-found: error

      - name: Setup sign tool version variable
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "ANDROID_SIGN_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION

      - uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        name: Sign app APK
        if: ${{ !inputs.qa-artifacts && env.ANDROID_SIGNING_KEY != null }}
        id: sign-rustdesk
        with:
          releaseDirectory: ./signed-apk
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          # env.ANDROID_SIGN_TOOL_VERSION is set by Step "Setup sign tool version variable"
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}

      - name: Verify signed Android identity
        if: ${{ !inputs.qa-artifacts && env.ANDROID_SIGNING_KEY != null && env.UPLOAD_ARTIFACT == 'true' }}
        shell: bash
        env:
          APK: ${{steps.sign-rustdesk.outputs.signedReleaseFile}}
        run: |
          set -euo pipefail
          badging="$(/usr/local/lib/android/sdk/build-tools/${ANDROID_SIGN_TOOL_VERSION}/aapt dump badging "$APK")"
          grep -Fq "package: name='tech.sevendesk.app'" <<<"$badging"
          grep -Fq "application-label:'Seven Desk'" <<<"$badging"
          signer_info="$(/usr/local/lib/android/sdk/build-tools/${ANDROID_SIGN_TOOL_VERSION}/apksigner verify --verbose --print-certs "$APK")"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<<"$signer_info"
          grep -Eq '^Signer #1 certificate SHA-256 digest: [[:xdigit:]]{64}$' <<<"$signer_info"
          if grep -Eiq '^Signer #[0-9]+ certificate DN:.*CN=Android Debug([, ]|$)' <<<"$signer_info"; then
            echo 'Release blocked: APK signed using Android Debug certificate' >&2
            exit 1
          fi

      - name: Upload Artifacts
        if: ${{ !inputs.qa-artifacts && env.ANDROID_SIGNING_KEY != null && env.UPLOAD_ARTIFACT == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sevendesk-${{ env.VERSION }}-${{ matrix.job.arch }}.apk
          path: ${{steps.sign-rustdesk.outputs.signedReleaseFile}}

      - name: Publish signed apk package
        if: env.ANDROID_SIGNING_KEY != null && env.UPLOAD_ARTIFACT == 'true' && inputs.upload-artifact && !inputs.qa-artifacts
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          name: sevendesk
          files: |
            ${{steps.sign-rustdesk.outputs.signedReleaseFile}}

      - name: Publish unsigned apk package
        if: env.ANDROID_SIGNING_KEY == null && env.UPLOAD_ARTIFACT == 'true' && env.TAG_NAME == 'nightly' && inputs.upload-artifact && !inputs.qa-artifacts
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          name: sevendesk
          files: |
            signed-apk/sevendesk-${{ env.VERSION }}-${{ matrix.job.arch }}.apk

