name: Flutter Tag Build

on:
  workflow_dispatch:
  push:
    # Publish a branded Windows installer after the Seven Desk packaging correction.
    branches:
      - main
    paths:
      - '.github/workflows/flutter-tag.yml'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

# The release publishing steps require access to create a tag and upload assets.
permissions:
  contents: write

jobs:
  preflight-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate Python packaging and Debian maintainer scripts
        run: |
          python3 -m py_compile build.py
          python3 -m unittest discover -s tests -p 'test_debian_maintainer_script_permissions.py' -v
          python3 -m unittest discover -s tests -p 'test_mfx_dispatch_patch.py' -v
          python3 -m unittest discover -s tests -p 'test_windows_sevendesk_branding.py' -v

  run-flutter-tag-build:
    needs: preflight-release
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref == 'refs/heads/main' && 'v1.5.3-5' || github.ref_name }}
      publish-update-metadata: ${{ github.repository == 'rustdesk/rustdesk' }}
