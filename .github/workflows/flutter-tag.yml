name: Seven Desk Release Build

on:
  push:
    tags:
      # GitHub Actions tag filters are glob patterns, not regex.
      # Strict tag/version consistency is enforced by preflight tests.
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'

# The release publishing steps require access to create a tag and upload assets.
permissions:
  contents: write

jobs:
  preflight-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate Python packaging and Debian maintainer scripts
        run: |
          python3 -m py_compile build.py
          python3 -m py_compile scripts/publish_vps_release.py
          python3 -m py_compile scripts/sync_public_release.py
          python3 -m unittest discover -s tests -p 'test_debian_maintainer_script_permissions.py' -v
          python3 -m unittest discover -s tests -p 'test_mfx_dispatch_patch.py' -v
          python3 -m unittest discover -s tests -p 'test_windows_sevendesk_branding.py' -v
          python3 -m unittest discover -s tests -p 'test_appimage_identity.py' -v
          python3 -m unittest discover -s tests -p 'test_linux_package_branding.py' -v
          python3 -m unittest discover -s tests -p 'test_android_release_signing_workflow.py' -v
          python3 -m unittest discover -s tests -p 'test_release_version_consistency.py' -v
          python3 -m unittest discover -s tests -p 'test_vps_release_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_dependency_mirrors.py' -v
          python3 -m unittest discover -s tests -p 'test_windows_helper_pch.py' -v

  run-flutter-tag-build:
    needs: preflight-release
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}
      publish-update-metadata: ${{ github.repository == 'rustdesk/rustdesk' }}

  finalize-release:
    needs: run-flutter-tag-build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify complete release
        run: |
          python3 - <<'PY'
          import os
          from scripts.publish_vps_release import API, read_json, select_assets, tag_commit

          tag = os.environ["GITHUB_REF_NAME"]
          commit = os.environ["GITHUB_SHA"]
          run = read_json(f"{API}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          if tag_commit(tag) != commit or run["head_sha"] != commit:
              raise ValueError("Release source does not match the tag and build")
          release = read_json(f"{API}/releases/tags/{tag}")
          if release["draft"]:
              raise ValueError("Release is still a draft")
          assets = select_assets(release, run["run_started_at"])
          print(f"Verified {len(assets)} installers for {tag}")
          PY
      # Physical QA and Android distribution signing need evidence outside CI.
      # Leave builds as prereleases; a human can promote only after those checks.
      - name: Hold production promotion pending physical QA
        run: echo 'CI assets verified; await two-machine and UAC QA before promotion.'
