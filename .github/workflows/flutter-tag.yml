name: Flutter Tag Build

on:
  workflow_dispatch:
  push:
    # Hotfix release on main after correcting Android build script execution.
    branches:
      - main
    paths:
      - '.github/workflows/flutter-tag.yml'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

# The release publishing steps require access to create a tag and upload assets.
permissions:
  contents: write

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref == 'refs/heads/main' && 'v1.5.3-1' || github.ref_name }}
      publish-update-metadata: ${{ github.repository == 'rustdesk/rustdesk' }}
