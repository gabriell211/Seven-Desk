name: Seven Desk Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"

permissions:
  contents: read

jobs:
  website-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate JavaScript syntax
        run: |
          node --version
          node --check website/api/download.js
          node --check website/script.js
      - name: Configure Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund
      - name: Run website tests
        working-directory: website
        run: npm test
      - name: Build production website
        working-directory: website
        run: npm run build
      - name: Check private source exclusion from published assets
        shell: bash
        run: |
          test -f website/public/conta.html
          test -f website/public/conta.bundle.js
          test -f website/public/index.html
          test ! -d website/public/api
          test ! -d website/public/db
          test ! -f website/public/package-lock.json
