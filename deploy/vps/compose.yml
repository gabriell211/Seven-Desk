name: sevendesk
services:
  db:
    image: postgres:17.12-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sevendesk}
      POSTGRES_USER: ${POSTGRES_USER:-sevendesk}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 20s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    pids_limit: 150

  site:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.site
    image: sevendesk/site:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3100'
      SEVEN_ACCOUNT_STATUS_ENABLED: '0'
      SEVEN_REGISTRATION_ENABLED: '0'
      SEVEN_PASSWORD_RECOVERY_ENABLED: '0'
      SEVEN_BILLING_ENABLED: '0'
      SEVEN_WEBHOOK_ENABLED: '0'
      SEVEN_LICENSE_API_ENABLED: '0'
      SEVEN_SALES_LAUNCH_APPROVED: '0'
      SEVEN_SITE_URL: ${SEVEN_SITE_URL:-https://www.sevendesk.tech}
      SEVEN_AVATAR_DIR: /srv/sevendesk/avatars
      SEVEN_DB_HOST: db
      SEVEN_DB_PORT: '5432'
      SEVEN_DB_NAME: ${POSTGRES_DB:-sevendesk}
      SEVEN_DB_USER: sevendesk_app
      SEVEN_DB_PASSWORD_FILE: /run/secrets/app_db_password
      SEVEN_AUTH_SECRET_FILE: /run/secrets/auth_secret
      SEVEN_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      INFINITEPAY_HANDLE: ${INFINITEPAY_HANDLE:-}
      INFINITEPAY_API_KEY_FILE: /run/secrets/infinitepay_api_key
    secrets: [app_db_password, auth_secret, smtp_password, infinitepay_api_key]
    volumes: [avatars:/srv/sevendesk/avatars]
    depends_on:
      db:
        condition: service_healthy
    networks: [data, frontend]
    read_only: true
    tmpfs: [/tmp:size=32m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 150
    healthcheck:
      test: [CMD, node, '-e', "fetch('http://127.0.0.1:3100/api/account-availability').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  # One-time migration: run with --profile setup run --rm migrate. No public ports.
  migrate:
    image: sevendesk/site:local
    profiles: [setup]
    command: [node, db/migrate.mjs]
    environment:
      NODE_ENV: production
      SEVEN_SITE_URL: ${SEVEN_SITE_URL:-https://www.sevendesk.tech}
      SEVEN_DB_HOST: db
      SEVEN_DB_PORT: '5432'
      SEVEN_DB_NAME: ${POSTGRES_DB:-sevendesk}
      SEVEN_DB_USER: ${POSTGRES_USER:-sevendesk}
      SEVEN_DB_PASSWORD_FILE: /run/secrets/pg_password
      SEVEN_RUNTIME_DB_PASSWORD_FILE: /run/secrets/app_db_password
      SEVEN_AUTH_SECRET_FILE: /run/secrets/auth_secret
      SEVEN_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    secrets: [pg_password, app_db_password, auth_secret, smtp_password]
    depends_on:
      db:
        condition: service_healthy
    networks: [data]
    read_only: true
    tmpfs: [/tmp:size=32m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  edge:
    image: caddy:2.11.9-alpine
    profiles: [cutover]
    restart: unless-stopped
    depends_on:
      site:
        condition: service_healthy
    environment:
      SEVEN_WEB_DOMAIN: ${SEVEN_WEB_DOMAIN:-www.sevendesk.tech}
      SEVEN_DOWNLOADS_DOMAIN: ${SEVEN_DOWNLOADS_DOMAIN:-downloads.sevendesk.tech}
      SEVEN_ACME_EMAIL: ${SEVEN_ACME_EMAIL:-sevendesk@sevendesk.tech}
    ports: ['80:80/tcp', '443:443/tcp', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - downloads:/srv/downloads:ro
    networks: [frontend]
    read_only: true
    tmpfs: [/tmp:size=32m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    pids_limit: 120

  # Disabled by default. Run only after backing up keys and auditing active ports.
  seven-relay:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.signaling
    image: sevendesk/signaling:local
    profiles: [signaling]
    command: [seven-relay]
    network_mode: host
    volumes: [signaling_data:/var/lib/sevendesk/server]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 120

  seven-id:
    image: sevendesk/signaling:local
    profiles: [signaling]
    command: [seven-id, -r, "${SEVEN_RELAY_HOST:-sevendesk.tech}:21117"]
    network_mode: host
    volumes: [signaling_data:/var/lib/sevendesk/server]
    restart: unless-stopped
    depends_on: [seven-relay]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 120

networks:
  frontend: {}
  data:
    internal: true

volumes:
  pgdata: {}
  avatars: {}
  downloads: {}
  caddy_data: {}
  caddy_config: {}
  signaling_data: {}

secrets:
  pg_password:
    file: /etc/sevendesk/secrets/pg_password
  app_db_password:
    file: /etc/sevendesk/secrets/app_db_password
  auth_secret:
    file: /etc/sevendesk/secrets/auth_secret
  smtp_password:
    file: /etc/sevendesk/secrets/smtp_password
  infinitepay_api_key:
    file: /etc/sevendesk/secrets/infinitepay_api_key
