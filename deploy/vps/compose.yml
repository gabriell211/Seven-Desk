name: sevendesk
services:
  db:
    image: postgres:17.12-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: sevendesk
      POSTGRES_USER: sevendesk
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sevendesk -d sevendesk']
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 20s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    pids_limit: 150

  site:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.site
    image: sevendesk/site:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3100'
      SEVEN_ACCOUNT_STATUS_ENABLED: '0'
      SEVEN_REGISTRATION_ENABLED: '0'
      SEVEN_PASSWORD_RECOVERY_ENABLED: '0'
      SEVEN_BILLING_ENABLED: '0'
      SEVEN_WEBHOOK_ENABLED: '0'
      SEVEN_LICENSE_API_ENABLED: '0'
      SEVEN_SALES_LAUNCH_APPROVED: '0'
      SEVEN_SITE_URL: https://www.sevendesk.tech
      SEVEN_AVATAR_DIR: /srv/sevendesk/avatars
    volumes: [avatars:/srv/sevendesk/avatars]
    depends_on:
      db:
        condition: service_healthy
    networks: [data, frontend]
    read_only: true
    tmpfs: [/tmp:size=32m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 150
    healthcheck:
      test: [CMD, node, '-e', "fetch('http://127.0.0.1:3100/api/account-availability').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  edge:
    image: caddy:2.11.9-alpine
    profiles: [cutover]
    restart: unless-stopped
    depends_on:
      site:
        condition: service_healthy
    ports: ['80:80/tcp', '443:443/tcp', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - downloads:/srv/downloads:ro
    networks: [frontend]
    read_only: true
    tmpfs: [/tmp:size=32m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    pids_limit: 120

networks:
  frontend: {}
  data:
    internal: true

volumes:
  pgdata: {}
  avatars: {}
  downloads: {}
  caddy_data: {}
  caddy_config: {}

secrets:
  pg_password:
    file: /etc/sevendesk/secrets/pg_password
